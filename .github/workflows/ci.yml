name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REDIS_URL: redis://localhost:6379/0
      EXTRACTION_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry==2.4.1 && poetry install
      - run: poetry run ruff check . && poetry run ruff format --check .
      - run: poetry run pytest
